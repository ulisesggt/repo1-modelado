[project]
name = "practica2-modelado"
version = "1.0.0"
description = "Repo 1 - Modelado: Optuna + calibración + Venn-Abers para detección de impago"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "optuna>=3.6",
    "lightgbm>=4.3",
    "xgboost>=2.0",
    "joblib>=1.3",
    "matplotlib>=3.8",
    "openpyxl>=3.1",
    "ipykernel>=6.29",
    "notebook>=7.1",
    "nbconvert>=7.16",
    "nbformat>=5.10",
]

[tool.uv]
package = false
